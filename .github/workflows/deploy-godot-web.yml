name: Build and deploy Veldara Web

on:
  push:
    branches:
      - feature/godot-25d-rebuild
    paths:
      - "godot/**"
      - ".github/workflows/deploy-godot-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: veldara-pages
  cancel-in-progress: true

jobs:
  build:
    name: Export Godot for Web
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot Web export templates
        run: |
          set -eu
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            --output /tmp/godot-export-templates.tpz
          unzip -j -o /tmp/godot-export-templates.tpz \
            "templates/web_nothreads_debug.zip" \
            "templates/web_nothreads_release.zip" \
            -d "$TEMPLATE_DIR"
          test -s "$TEMPLATE_DIR/web_nothreads_debug.zip"
          test -s "$TEMPLATE_DIR/web_nothreads_release.zip"

      - name: Import project resources
        working-directory: godot
        run: godot --headless --editor --import

      - name: Export Web build
        working-directory: godot
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Verify exported entry point
        run: test -s godot/build/web/index.html

      - name: Add hosting marker
        run: touch godot/build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: godot/build/web

  deploy:
    name: Publish to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
